<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tecof Theme Editor — Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ──────────────────────────────────────────────────────────────
       Tailwind v4 — PLAYGROUND ONLY (live preview of the Style editor).
       In production the HOST app's Tailwind build provides these classes;
       feed getSafelist() into its `safelist` so chosen classes always ship.
       The brand palette is registered as @theme so bg-primary-600 etc. work.
  ─────────────────────────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-primary-50: #faffe4;
      --color-primary-100: #f2ffc5;
      --color-primary-200: #e3ff92;
      --color-primary-300: #ceff53;
      --color-primary-400: #b6fb20;
      --color-primary-500: #9ae600;
      --color-primary-600: #74b500;
      --color-primary-700: #588902;
      --color-primary-800: #476c08;
      --color-primary-900: #3c5b0c;
      --color-primary-950: #1d3300;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
